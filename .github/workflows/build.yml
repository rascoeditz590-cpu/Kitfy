name: Build Kitfy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code lo
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor project banao
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kitfy.app",
            "appName": "Kitfy",
            "webDir": "www",
            "backgroundColor": "#0E0D1A"
          }
          EOF
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Icons banao
        run: |
          echo "Repo ki PNG files:"
          find . -path ./node_modules -prune -o -iname '*.png' -print
          LIME=$(find . -path ./node_modules -prune -o -path ./android -prune -o -iname '*lime*.png' -print | head -n1)
          FG=$(find . -path ./node_modules -prune -o -path ./android -prune -o -iname '*foreground*.png' -print | head -n1)
          if [ -z "$LIME" ]; then
            echo "ERROR: lime icon PNG nahi mila"
            exit 1
          fi
          if [ -z "$FG" ]; then FG="$LIME"; fi
          echo "Icon: $LIME"
          echo "Foreground: $FG"
          mkdir -p icon-src
          cp "$LIME" icon-src/icon-only.png
          cp "$FG" icon-src/icon-foreground.png
          npm install @capacitor/assets@3
          npx capacitor-assets generate --android --assetPath icon-src --iconBackgroundColor '#C8F135' --iconBackgroundColorDark '#C8F135'
            - name: Icon background theek karo
        run: |
          RES=android/app/src/main/res
          ls $RES/mipmap-anydpi-v26 || true
          for f in $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml; do
            [ -f "$f" ] && sed -i 's#@mipmap/ic_launcher_background#@color/ic_launcher_background#g' "$f"
          done
          mkdir -p $RES/values
          cat > $RES/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#C8F135</color>
          </resources>
          EOF
          cat $RES/mipmap-anydpi-v26/ic_launcher.xml
      - name: Debug APK build karo
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK ka naam Kitfy karo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kitfy.apk

      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: Kitfy-APK
          path: Kitfy.apk
