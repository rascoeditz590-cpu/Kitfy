name: Build Kitfy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code lo
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor project banao
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kitfy.app",
            "appName": "Kitfy",
            "webDir": "www",
            "backgroundColor": "#0E0D1A"
          }
          EOF
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Kitfy icon lagao
        run: |
          sudo apt-get install -y imagemagick
          LIME=$(find Assets assets -iname '*lime*.png' 2>/dev/null | head -n1)
          if [ -z "$LIME" ]; then
            echo "ERROR: lime icon PNG nahi mila"
            find . -iname '*.png' -not -path './node_modules/*' -not -path './android/*'
            exit 1
          fi
          echo "Icon use ho raha hai: $LIME"
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            D=${pair%%:*}
            S=${pair##*:}
            mkdir -p $RES/mipmap-$D
            convert "$LIME" -resize ${S}x${S} $RES/mipmap-$D/ic_launcher.png
            cp $RES/mipmap-$D/ic_launcher.png $RES/mipmap-$D/ic_launcher_round.png
            rm -f $RES/mipmap-$D/ic_launcher_foreground.png
          done
          ls -R $RES | grep -i launcher

      - name: Debug APK build karo
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK ka naam Kitfy karo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kitfy.apk

      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: Kitfy-APK
          path: Kitfy.apk
