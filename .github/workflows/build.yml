name: Build Kitfy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code lo
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor project banao
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kitfy.app",
            "appName": "Kitfy",
            "webDir": "www",
            "backgroundColor": "#0E0D1A"
          }
          EOF
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Icons banao
        run: |
          echo "Assets folder me ye files hain:"
          ls -la assets
          mkdir -p icon-src
          cp "assets/ICON_FILE.png" icon-src/icon-only.png
          cp "assets/ICON_FILE.png" icon-src/icon-foreground.png
          npm install @capacitor/assets
          npx capacitor-assets generate --android --assetPath icon-src --iconBackgroundColor '#C8F135' --iconBackgroundColorDark '#C8F135'

            - name: APK rename karo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kitfy.apk

      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: Kitfy-APK
          path: Kitfy.apk
