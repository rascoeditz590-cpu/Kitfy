<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D1A">
<title>Kitfy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E0D1A;--surf:#1A1830;--surf2:#25223F;--line:#2E2B4D;--line2:#39355C;--mist:#F4F3FF;--mute:#A9A6C8;--lime:#C8F135;--coral:#FF6A4D;--violet:#7B5CFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--mist);font-family:'DM Sans',system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font-family:inherit}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto;padding:max(24px,env(safe-area-inset-top)) 20px 28px;display:flex;flex-direction:column;gap:16px}
.sora,h1,h2,h3{font-family:'Sora',system-ui,sans-serif}
h2{margin:0;font-size:20px}
.mute{color:var(--mute);font-size:13px}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.top h2{flex:1}
.icon-btn{width:44px;height:44px;border:0;border-radius:50%;background:var(--surf2);color:var(--mist);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn.sm{width:36px;height:36px}
.btn{height:52px;border:0;border-radius:26px;padding:0 24px;font:700 16px 'Sora',system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn.lime{background:var(--lime)}.btn.coral{background:var(--coral)}
.btn.ghost{background:transparent;color:var(--mist);border:2px solid var(--line2)}
.btn.sm{height:44px;font-size:14px;padding:0 18px}
.btn.full{width:100%}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--line2);background:transparent;color:var(--mist);font:500 14px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.chip.on{background:var(--lime);border-color:var(--lime);color:var(--ink);font-weight:700}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--line2);flex:none;cursor:pointer;padding:0}
.card{background:var(--surf);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
.fld input,.fld select,.fld textarea,.inp{height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--ink);color:var(--mist);padding:0 14px;font:400 16px 'DM Sans',sans-serif;outline:none;width:100%;min-width:0}
.fld textarea{height:auto;padding:12px 14px;border-radius:18px;resize:none}
.fld input[type=range]{padding:0;accent-color:var(--lime);border:0;background:transparent}
.fld input[type=color],.cin{width:44px;height:44px;padding:0;border:3px solid var(--line2);border-radius:50%;background:none;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rowf{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{height:118px;padding:14px;border-radius:24px;background:var(--surf);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:var(--mist);cursor:pointer}
.tile b{font-size:15px}
.tile small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.tic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.hero{border-radius:28px;background:var(--lime);color:var(--ink);padding:18px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.hero h3{margin:0;font-size:24px;line-height:1.15;font-weight:800}
.hero .btn{background:var(--ink);color:var(--lime);height:40px;font-size:14px;padding:0 18px}
.search{height:48px;border-radius:24px;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--mute)}
.search input{flex:1;min-width:0;height:44px;border:0;outline:0;background:transparent;color:var(--mist);font-size:16px}
.nav{height:calc(84px + env(safe-area-inset-bottom));padding:0 12px env(safe-area-inset-bottom);background:var(--surf);border-top:1px solid var(--line);border-radius:28px 28px 0 0;display:flex;align-items:center;justify-content:space-around;flex:none}
.nav button{width:64px;height:56px;border:0;background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 11px 'DM Sans',sans-serif;cursor:pointer}
.nav button.on{color:var(--lime)}
.nav .fab{width:60px;height:60px;margin-top:-26px;border:4px solid var(--ink);border-radius:50%;background:var(--lime);color:var(--ink)}
.paper{background:#fff;color:#0E0D1A;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.paper .ph{display:flex;justify-content:space-between;align-items:center}
.paper .big{font-size:24px;font-weight:800}
.paper .rule{height:2px;background:#0E0D1A}
.paper .lbl{font-size:12px;font-weight:700;color:#5A5775}
.paper .li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.paper .tot{font-size:26px;font-weight:800;color:#5B3FE0}
.cvwrap{display:grid;place-items:center;background:var(--surf);border-radius:20px;padding:10px}
#cv{max-width:100%;max-height:42dvh;width:auto;height:auto;border-radius:10px;touch-action:none;display:block}
.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tray button{height:64px;border:0;border-radius:18px;background:var(--surf);color:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 11px 'DM Sans',sans-serif;cursor:pointer}
.tray button.hot{background:var(--lime);color:var(--ink);font-weight:700}
.plan{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;background:var(--surf);border:1px solid var(--line)}
.tag{height:26px;padding:0 12px;border-radius:13px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;border:0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{height:68px;border:0;border-radius:18px;background:var(--surf);color:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.day span{font-size:12px;color:var(--mute)}
.day b{font:700 17px 'Sora',sans-serif}
.day.on{background:var(--lime);color:var(--ink)}
.day.on span{color:var(--ink);font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;background:var(--coral)}
.dot.off{background:transparent}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.thumb{position:relative;border-radius:16px;overflow:hidden;background:var(--surf)}
.thumb img{width:100%;display:block}
.thumb button.x{position:absolute;right:6px;top:6px}
.row-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--line)}
.row-item .grow{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--mist);cursor:pointer;padding:0}
.hook{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:20px;background:var(--surf);border:1px solid var(--line);font-size:15px;line-height:1.4}
.hook p{margin:0;flex:1}
.ov{position:fixed;inset:0;background:rgba(14,13,26,.7);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sh{width:100%;max-width:480px;background:var(--surf);border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--mist);color:var(--ink);padding:12px 18px;border-radius:22px;font-weight:700;font-size:14px;z-index:60;max-width:90%}
.empty{padding:18px;border-radius:20px;border:2px dashed var(--line2);color:var(--mute);font-size:14px;text-align:center}
.logoimg{width:72px;height:72px;border-radius:18px;object-fit:cover;background:var(--surf2)}
iframe.prev{width:100%;height:420px;border:0;border-radius:20px;background:#fff}
.role{height:72px;padding:12px 14px;border-radius:20px;background:var(--surf);border:2px solid var(--line);color:var(--mist);text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px;font:700 15px 'Sora',system-ui,sans-serif}
.role small{font:400 12px 'DM Sans',sans-serif;color:var(--mute)}
.role.on{border-color:var(--lime);background:var(--surf2)}
.av{border-radius:50%;object-fit:cover;background:var(--surf2);display:grid;place-items:center;color:var(--lime);font:800 20px 'Sora',sans-serif;flex:none;overflow:hidden}
.err{color:var(--coral);font-size:14px;line-height:1.4}
.pcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--line);width:100%;text-align:left;color:var(--mist);cursor:pointer}
.pcard .tx{flex:1;min-width:0}
.pcard .bi{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:disabled{opacity:.6;cursor:default}
@media print{body *{visibility:hidden}#paper,#paper *{visibility:visible}#paper{position:absolute;left:0;top:0;width:100%;border-radius:0}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="photoFile" accept="image/*" hidden>
<input type="file" id="logoFile" accept="image/*" hidden>
<input type="file" id="avatarFile" accept="image/*" hidden>
<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>new Date(s+'T00:00:00');
const inr=n=>'\u20B9 '+Number(n||0).toLocaleString('en-IN');
const ic=(p,s=22,sw=2.2)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const I={
back:'<path d="M15 5l-7 7 7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',
img:'<rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/>',
doc:'<path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M9 11h6M9 15h6"/>',
cal:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
bolt:'<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>',
drop:'<path d="M12 3.5c4.5 4 6.5 7 6.5 10a6.5 6.5 0 0 1-13 0c0-3 2-6 6.5-10z"/>',
link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
home:'<path d="M4 11l8-7 8 7v9H4z"/>',bookmark:'<path d="M6 4h12v16l-6-4-6 4z"/>',
trash:'<path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/>',copy:'<rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',text:'<path d="M5 6V4.5h14V6M12 4.5V20M9 20h6"/>',
box:'<rect x="4" y="6" width="16" height="12" rx="3"/>',circ:'<circle cx="12" cy="12" r="7.5"/>',
people:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 13.8c2.8 0 4.5 2 4.5 4.7"/>',
user:'<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c0-4 3.3-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/>',
refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
chev:'<path d="M9 5l7 7-7 7"/>',left:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',front:'<path d="M12 4l9 5-9 5-9-5zM3 14l9 5 9-5"/>'
};
const logo=(s,bg,fg)=>'<span style="width:'+s+'px;height:'+s+'px;border-radius:'+Math.round(s*.28)+'px;background:'+bg+';display:grid;place-items:center"><svg width="'+Math.round(s*.6)+'" height="'+Math.round(s*.6)+'" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M10 8V28" stroke="'+fg+'" stroke-width="4.5" stroke-linecap="round"/><path d="M26 9L13.5 18L26 28" stroke="'+fg+'" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29" cy="8" r="3" fill="#FF6A4D"/></svg></span>';

/* ---------- storage ---------- */
const KEY='kitfy:v1';
const defaults=()=>({brand:{name:'',colors:['#C8F135','#FF6A4D','#7B5CFF','#F4F3FF','#0E0D1A'],font:'Sora',logo:''},invoices:[],plans:[],bio:{name:'',tag:'',links:[{l:'',u:''}],accent:'#C8F135'},designs:[],invN:0});
let db=(function(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return defaults()}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Phone me jagah kam hai. Kuch purana hata do.');return false}}
let tt;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>{t.style.display='none'},2200)}
function copyText(x){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(x).then(()=>toast('Copy ho gaya'),fb)}else fb();function fb(){const a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copy ho gaya')}catch(e){toast('Copy nahi hua')}a.remove()}}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function resizeImage(file,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',0.88),c.width,c.height)};im.src=r.result};r.readAsDataURL(file)}

/* ---------- state + router ---------- */
const S={q:'',route:'home',pdate:iso(new Date()),padd:false,pplat:'YouTube',niche:'Fitness',topic:'',hooks:[],caps:[],tags:''};
const TOOLS=[
{id:'designer',name:'Thumbnail',sub:'Poster aur cover',bg:'var(--violet)',fg:'#fff',ic:'img'},
{id:'invoice',name:'Invoice',sub:'UPI link ke saath',bg:'var(--coral)',fg:'var(--ink)',ic:'doc'},
{id:'planner',name:'Planner',sub:'Ideas aur dates',bg:'var(--lime)',fg:'var(--ink)',ic:'cal'},
{id:'hooks',name:'Hook Writer',sub:'Hooks aur captions',bg:'var(--coral)',fg:'var(--ink)',ic:'bolt'},
{id:'brand',name:'Brand Kit',sub:'Colors, fonts, logo',bg:'var(--lime)',fg:'var(--ink)',ic:'drop'},
{id:'bio',name:'Link in Bio',sub:'Portfolio page',bg:'var(--violet)',fg:'#fff',ic:'link'}
];
function go(r,push=true){S.route=r;if(push)history.pushState({r:r},'');render()}
history.replaceState({r:'home'},'');
window.addEventListener('popstate',e=>{S.route=(e.state&&e.state.r)||'home';render()});

const topBar=(t,right)=>'<div class="top"><button class="icon-btn" data-a="back" aria-label="Wapas">'+ic(I.back)+'</button><h2>'+t+'</h2>'+(right||'')+'</div>';
const nav=a=>'<nav class="nav"><button data-a="go" data-r="home" class="'+(a==='home'?'on':'')+'">'+ic(I.home,24)+'Home</button><button data-a="go" data-r="discover" class="'+(a==='discover'?'on':'')+'">'+ic(I.people,24)+'Discover</button><button class="fab" data-a="sheet" aria-label="Naya banao">'+ic(I.plus,26,3)+'</button><button data-a="go" data-r="saved" class="'+(a==='saved'?'on':'')+'">'+ic(I.bookmark,24)+'Saved</button><button data-a="go" data-r="me" class="'+(a==='me'?'on':'')+'">'+ic(I.user,24)+'Profile</button></nav>';
const fld=(label,key,val,type,ph)=>'<label class="fld"><span>'+label+'</span><input data-i="'+key+'" type="'+(type||'text')+'" value="'+esc(val)+'" placeholder="'+esc(ph||'')+'"></label>';

function guard(R){const st=AUTH.status;
if(!(R==='auth'||R==='setup'||R==='discover'||R==='me'||R==='profile'))return R;
if(st==='loading'||st==='error')return 'wait';
if(st==='out')return 'auth';
if(st==='setup')return 'setup';
if(R==='profile'&&!VIEW)return 'discover';
return (R==='auth'||R==='setup')?'home':R}
function render(){
const R=guard(S.route);if(R!=='me'&&R!=='setup')PF=null;
const S_={home:homeS,saved:savedS,designer:designerS,invoice:invoiceS,planner:plannerS,hooks:hooksS,brand:brandS,bio:bioS,auth:authS,setup:setupS,me:meS,discover:discoverS,profile:profileS,wait:waitS};
const withNav=R==='home'||R==='saved'||R==='discover'||R==='me';
$('#app').innerHTML='<div class="scroll">'+S_[R]()+'</div>'+(withNav?nav(R):'');
if(R==='designer')initDesigner();
if(R==='bio')bioPreview();
if(R==='discover'&&!DS.loaded&&!DS.loading)loadDiscover();
}

/* ---------- home ---------- */
const tileH=t=>'<button class="tile" data-a="open" data-t="'+t.id+'"><span class="tic" style="background:'+t.bg+';color:'+t.fg+'">'+ic(I[t.ic])+'</span><span><b class="sora">'+t.name+'</b><small>'+t.sub+'</small></span></button>';
function gridH(){const q=S.q.toLowerCase();const l=TOOLS.filter(t=>(t.name+' '+t.sub).toLowerCase().includes(q));return l.length?l.map(tileH).join(''):'<div class="empty" style="grid-column:1/-1">Ye tool nahi mila. Koi aur naam try karo.</div>'}
function homeS(){return '<div class="top">'+logo(40,'#C8F135','#0E0D1A')+'<h2 style="font-size:26px;font-weight:800;letter-spacing:-.5px">Kitfy</h2></div>'+
'<label class="search">'+ic(I.search,20)+'<input data-i="q" type="text" placeholder="Tool dhundo..." aria-label="Tool dhundo" value="'+esc(S.q)+'"></label>'+
accH()+'<div class="hero"><div><div style="font-size:13px;font-weight:700">Aaj ka kaam</div><h3>Ek thumbnail banao,<br>2 minute mein.</h3></div><button class="btn" data-a="open" data-t="designer">Shuru karo</button></div>'+
'<div class="sora" style="font-weight:700;font-size:18px">Tumhare tools</div><div class="grid2" id="grid">'+gridH()+'</div>'}

/* ---------- saved ---------- */
function savedS(){
const inv=db.invoices.map(v=>'<div class="row-item"><button class="grow" data-a="inv-open" data-id="'+v.id+'"><b class="sora">'+esc(v.no)+'</b> <span class="mute">'+esc(v.client||'Client')+'</span><div class="mute">'+inr(invTotal(v))+'</div></button><button class="icon-btn sm" data-a="inv-del" data-id="'+v.id+'" aria-label="Invoice hatao">'+ic(I.trash,18)+'</button></div>').join('');
const th=db.designs.map(d=>'<div class="thumb"><button style="border:0;padding:0;display:block;width:100%;cursor:pointer;background:none" data-a="d-load" data-id="'+d.id+'" aria-label="Design kholo"><img src="'+d.thumb+'" alt="Saved design"></button><button class="icon-btn sm x" data-a="d-del" data-id="'+d.id+'" aria-label="Design hatao">'+ic(I.x,16)+'</button></div>').join('');
return '<div class="top"><h2 style="font-size:24px">Saved</h2></div>'+
'<div class="sora" style="font-weight:700">Invoices</div>'+(inv||'<div class="empty">Abhi koi invoice save nahi hua. Invoice tool me banao.</div>')+
'<div class="sora" style="font-weight:700">Thumbnails</div>'+(th?'<div class="thumbs">'+th+'</div>':'<div class="empty">Abhi koi design save nahi hua. Thumbnail me Save Draft dabao.</div>')}

/* ---------- brand kit ---------- */
function brandS(){const b=db.brand;

const DF=[['Sora',"'Sora'"],['DM Sans',"'DM Sans'"],['Georgia','Georgia'],['Impact','Impact']];
const fcss=n=>(DF.find(x=>x[0]===n)||DF[0])[1];
const newDesign=()=>({id:uid(),w:1280,h:720,bg:db.brand.colors[2]||'#7B5CFF',sel:null,layers:[{id:uid(),t:'text',text:'APNA TITLE\nYAHAN',x:90,y:150,size:140,color:db.brand.colors[0]||'#C8F135',font:db.brand.font||'Sora',weight:800}]});
let D=newDesign(),cv=null,ctx=null,drag=null;const imgs={};
const fontOf=l=>(l.weight||800)+' '+l.size+'px '+fcss(l.font)+',system-ui,sans-serif';
function getImg(l){if(!imgs[l.id]){const i=new Image();i.onload=()=>drawCv();i.src=l.src;imgs[l.id]=i}return imgs[l.id]}
function bounds(l){if(l.t==='text'){ctx.font=fontOf(l);const ls=l.text.split('\n');return{x:l.x,y:l.y,w:Math.max.apply(null,ls.map(s=>ctx.measureText(s||' ').width)),h:ls.length*l.size*1.12}}return{x:l.x,y:l.y,w:l.w,h:l.h}}
function drawCv(exp){if(!ctx)return;ctx.clearRect(0,0,D.w,D.h);ctx.fillStyle=D.bg;ctx.fillRect(0,0,D.w,D.h);
D.layers.forEach(l=>{if(l.t==='text'){ctx.font=fontOf(l);ctx.fillStyle=l.color;ctx.textBaseline='top';l.text.split('\n').forEach((s,i)=>ctx.fillText(s,l.x,l.y+i*l.size*1.12))}
else if(l.t==='rect'){ctx.fillStyle=l.color;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(l.x,l.y,l.w,l.h,l.w*.06);else ctx.rect(l.x,l.y,l.w,l.h);ctx.fill()}
else if(l.t==='circle'){ctx.fillStyle=l.color;ctx.beginPath();ctx.ellipse(l.x+l.w/2,l.y+l.h/2,l.w/2,l.h/2,0,0,Math.PI*2);ctx.fill()}
else if(l.t==='img'){const im=getImg(l);if(im.complete&&im.naturalWidth)ctx.drawImage(im,l.x,l.y,l.w,l.h)}});
if(!exp&&D.sel){const l=D.layers.find(x=>x.id===D.sel);if(l){const b=bounds(l);const lw=Math.max(3,D.w/260);ctx.lineWidth=lw+3;ctx.strokeStyle='#0E0D1A';ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.lineWidth=lw;ctx.strokeStyle='#C8F135';ctx.strokeRect(b.x,b.y,b.w,b.h)}}}
const swH=act=>'<div class="chips">'+[...new Set(db.brand.colors.concat(['#FFFFFF','#0E0D1A']).map(c=>c.toUpperCase()))].map(c=>'<button class="sw" aria-label="Color '+c+'" data-a="'+act+'" data-c="'+c+'" style="background:'+c+'"></button>').join('')+'</div>';
function dPanel(){const l=D.layers.find(x=>x.id===D.sel);
if(!l)return '<div class="sora" style="font-weight:700">Background</div>'+swH('d-bg')+'<div class="mute">Kisi cheez ko tap karke chuno, phir ungli se hilao.</div>';

if(l.t==='text')h+='<label class="fld"><span>Text</span><textarea rows="2" data-i="d.text">'+esc(l.text)+'</textarea></label><div class="chips">'+DF.map(f=>'<button class="chip '+(l.font===f[0]?'on':'')+'" data-a="d-font" data-f="'+f[0]+'" style="font-family:'+f[1]+'">'+f[0]+'</button>').join('')+'</div><label class="fld"><span>Size</span><input type="range" min="20" max="400" value="'+l.size+'" data-i="d.size"></label>';

function initDesigner(){cv=$('#cv');cv.width=D.w;cv.height=D.h;ctx=cv.getContext('2d');drawCv();
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load("800 40px Sora"),document.fonts.load("700 40px 'DM Sans'")]).then(drawCv).catch(()=>{})}
const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*D.w/r.width,y:(e.clientY-r.top)*D.h/r.height}};
cv.addEventListener('pointerdown',e=>{const p=pt(e);const pd=D.w*.012;let hit=null;for(let i=D.layers.length-1;i>=0;i--){const l=D.layers[i],b=bounds(l);if(p.x>=b.x-pd&&p.x<=b.x+b.w+pd&&p.y>=b.y-pd&&p.y<=b.y+b.h+pd){hit=l;break}}
D.sel=hit?hit.id:null;drag=hit?{l:hit,dx:p.x-hit.x,dy:p.y-hit.y}:null;if(hit)cv.setPointerCapture(e.pointerId);drawCv();$('#dpanel').innerHTML=dPanel()});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);drag.l.x=p.x-drag.dx;drag.l.y=p.y-drag.dy;drawCv()});
const end=()=>{drag=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end)}

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('script'));document.head.appendChild(s)})}
function fbInit(){if(fbP)return fbP;
fbP=(async()=>{const libs=[['app','initializeApp'],['auth','auth'],['firestore','firestore']];
for(const l of libs){if(!(window.firebase&&window.firebase[l[1]]))await loadScript('https://www.gstatic.com/firebasejs/'+FBV+'/firebase-'+l[0]+'-compat.js')}
if(!firebase.apps.length)firebase.initializeApp(FBCFG);
const fs=firebase.firestore();try{fs.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
FB={auth:firebase.auth(),fs:fs,ts:()=>firebase.firestore.FieldValue.serverTimestamp()};
FB.auth.onAuthStateChanged(onAuth)})();
fbP.catch(()=>{fbP=null;FB=null;AUTH.status='error';render()});
return fbP}
function afterAuth(){const R=S.route;if(AUTH.status==='ok'&&(R==='auth'||R==='setup')){S.route='home';history.replaceState({r:'home'},'')}render()}
async function onAuth(u){AUTH.user=u;AUTH.profile=null;DS.loaded=false;DS.items=[];
if(!u){AUTH.status='out';afterAuth();return}
AUTH.status='loading';afterAuth();await loadProfile()}
async function loadProfile(){AUTH.status='loading';
try{const s=await FB.fs.collection('users').doc(AUTH.user.uid).get();AUTH.profile=s.exists?s.data():null;AUTH.status=s.exists?'ok':'setup'}catch(e){AUTH.status='error'}
afterAuth()}
function authErr(e){const m={'auth/invalid-email':'Email sahi nahi hai.','auth/email-already-in-use':'Ye email pehle se registered hai. Login karo.','auth/weak-password':'Password kam se kam 6 akshar ka rakho.','auth/invalid-credential':'Email ya password galat hai.','auth/user-not-found':'Ye email registered nahi hai.','auth/wrong-password':'Password galat hai.','auth/too-many-requests':'Bahut zyada try ho gaye. Thodi der baad try karo.','auth/network-request-failed':'Internet check karo.','auth/operation-not-allowed':'Email login Firebase me enable nahi hai.','auth/missing-password':'Password likho.','auth/user-disabled':'Ye account band hai.'};return m[(e&&e.code)||'']||'Kuch gadbad hui. Dobara try karo.'}
const okEmail=e=>/^\S+@\S+\.\S+$/.test(e);
const okPhoto=s=>typeof s==='string'&&s.length<60000&&/^data:image\/(jpeg|png);base64,[A-Za-z0-9+\/=]+$/.test(s);
function avatarH(p,s){const n=(p.name||'').trim();if(okPhoto(p.photo))return '<img class="av" src="'+esc(p.photo)+'" alt="" width="'+s+'" height="'+s+'" style="width:'+s+'px;height:'+s+'px">';return '<span class="av" style="width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s*.4)+'px">'+esc(Array.from(n||'?')[0].toUpperCase())+'</span>'}
const cleanH=(s,re)=>String(s||'').trim().replace(/^(https?:\/\/)?(www\.)?(instagram\.com|t\.me|telegram\.me)\//i,'').split(/[\/?#]/)[0].replace(/^@/,'').replace(re,'');
const cleanWa=s=>{let w=String(s||'').replace(/\D/g,'');if(w.length===10&&/^[6-9]/.test(w))w='91'+w;return w.slice(0,15)};
const pfBlank=()=>({role:'',name:'',city:'',bio:'',instagram:'',telegram:'',whatsapp:'',photo:''});
const pfFrom=p=>({role:p.role||'',name:p.name||'',city:p.city||'',bio:p.bio||'',instagram:p.instagram||'',telegram:p.telegram||'',whatsapp:p.whatsapp||'',photo:p.photo||''});
function squarePhoto(file,size,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,size,size);let q=.8,u=c.toDataURL('image/jpeg',q);while(u.length>50000&&q>.3){q-=.1;u=c.toDataURL('image/jpeg',q)}cb(u)};im.onerror=()=>toast('Ye photo khul nahi payi');im.src=r.result};r.readAsDataURL(file)}

function dlistH(){if(DS.loading||(!DS.loaded&&!DS.err))return '<div class="empty">Dhundh rahe hain...</div>';
if(DS.err)return '<div class="empty">'+esc(DS.err)+'</div>';

'<div id="dlist" style="display:flex;flex-direction:column;gap:10px">'+dlistH()+'</div>'}
async function loadDiscover(){if(DS.loading||!FB||AUTH.status!=='ok')return;
const role=DS.role;DS.loading=true;DS.err='';let el=$('#dlist');if(el)el.innerHTML=dlistH();
try{let q=FB.fs.collection('users');q=role==='all'?q.orderBy('updatedAt','desc'):q.where('role','==',role);
const s=await q.limit(60).get();DS.items=s.docs.map(d=>d.data())}
catch(e){DS.items=[];DS.err=e&&e.code==='permission-denied'?'Permission nahi mili. Firestore rules check karo.':'Load nahi hua. Internet check karo aur refresh dabao.'}
DS.loaded=true;DS.loading=false;
if(DS.role!==role&&S.route==='discover'){DS.loaded=false;return loadDiscover()}
el=$('#dlist');if(el)el.innerHTML=dlistH()}

'd-save'(){const s=D.sel;D.sel=null;drawCv(true);const th=snap(360);D.sel=s;drawCv();const st={id:D.id,thumb:th,state:{w:D.w,h:D.h,bg:D.bg,layers:D.layers}};const i=db.designs.findIndex(x=>x.id===D.id);if(i>=0)db.designs[i]=st;else db.designs.unshift(st);db.designs=db.designs.slice(0,12);if(save())toast('Draft save ho gaya')},
'd-load'(el){const d=db.designs.find(x=>x.id===el.dataset.id);D=Object.assign({id:d.id,sel:null},JSON.parse(JSON.stringify(d.state)));go('designer')},
'd-del'(el){db.designs=db.designs.filter(x=>x.id!==el.dataset.id);save();render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el,e)});
const IN={
q(v){S.q=v;$('#grid').innerHTML=gridH()},
'inv.from'(v){INV.from=v;$('#paper').innerHTML=paperH()},'inv.client'(v){INV.client=v;$('#paper').innerHTML=paperH()},'inv.no'(v){INV.no=v;$('#paper').innerHTML=paperH()},'inv.date'(v){INV.date=v;$('#paper').innerHTML=paperH()},'inv.upi'(v){INV.upi=v;$('#paper').innerHTML=paperH()},'inv.note'(v){INV.note=v;$('#paper').innerHTML=paperH()},
'item.d'(v,el){INV.items[+el.dataset.n].d=v;$('#paper').innerHTML=paperH()},'item.a'(v,el){INV.items[+el.dataset.n].a=v;$('#paper').innerHTML=paperH()},
'h.topic'(v){S.topic=v},
'au.email'(v){AU.email=v},'au.pass'(v){AU.pass=v},
'pf.name'(v){PF&&(PF.name=v)},'pf.city'(v){PF&&(PF.city=v)},'pf.bio'(v){PF&&(PF.bio=v)},'pf.instagram'(v){PF&&(PF.instagram=v)},'pf.telegram'(v){PF&&(PF.telegram=v)},'pf.whatsapp'(v){PF&&(PF.whatsapp=v)},
'ds.q'(v){DS.q=v;const el=$('#dlist');if(el)el.innerHTML=dlistH()},
'b.name'(v){db.brand.name=v;save();$('#bprev').innerHTML=brandPrev()},
'b.color'(v,el){db.brand.colors[+el.dataset.n]=v.toUpperCase();save();$('#bprev').innerHTML=brandPrev()},
'bio.name'(v){db.bio.name=v;save();bioPreview()},'bio.tag'(v){db.bio.tag=v;save();bioPreview()},
'bl.l'(v,el){db.bio.links[+el.dataset.n].l=v;save();bioPreview()},'bl.u'(v,el){db.bio.links[+el.dataset.n].u=v;save();bioPreview()},
'd.text'(v){const l=D.layers.find(x=>x.id===D.sel);if(l){l.text=v;drawCv()}},
'd.size'(v){const l=D.layers.find(x=>x.id===D.sel);if(!l)return;if(l.t==='text')l.size=+v;else{const r=l.h/l.w;l.w=+v;l.h=+v*r}drawCv()}
};
document.addEventListener('input',e=>{const el=e.target;const k=el.dataset&&el.dataset.i;if(k&&IN[k])IN[k](el.value,el)});
document.addEventListener('change',e=>{const el=e.target;const f=el.files&&el.files[0];if(!f)return;
if(el.id==='photoFile'){resizeImage(f,1280,(src,w,h)=>{const k=D.w*.5/w;const l={t:'img',src:src,x:D.w*.25,y:D.h*.1,w:w*k,h:h*k};if(S.route==='designer')addLayer(l)});el.value=''}
if(el.id==='logoFile'){resizeImage(f,512,src=>{db.brand.logo=src;save();render()});el.value=''}
if(el.id==='avatarFile'){squarePhoto(f,200,src=>{if(PF){PF.photo=src;render()}});el.value=''}});
document.addEventListener('keydown',e=>{const k=e.target.dataset&&e.target.dataset.i;if(e.key==='Enter'&&(k==='au.email'||k==='au.pass')){e.preventDefault();A['au-go']()}});
render();
fbInit();
