<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D1A">
<title>Kitfy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E0D1A;--surf:#1A1830;--surf2:#25223F;--line:#2E2B4D;--line2:#39355C;--mist:#F4F3FF;--mute:#A9A6C8;--lime:#C8F135;--coral:#FF6A4D;--violet:#7B5CFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--mist);font-family:'DM Sans',system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font-family:inherit}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto;padding:max(24px,env(safe-area-inset-top)) 20px 28px;display:flex;flex-direction:column;gap:16px}
.sora,h1,h2,h3{font-family:'Sora',system-ui,sans-serif}
h2{margin:0;font-size:20px}
.mute{color:var(--mute);font-size:13px}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.top h2{flex:1}
.icon-btn{width:44px;height:44px;border:0;border-radius:50%;background:var(--surf2);color:var(--mist);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn.sm{width:36px;height:36px}
.btn{height:52px;border:0;border-radius:26px;padding:0 24px;font:700 16px 'Sora',system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn.lime{background:var(--lime)}.btn.coral{background:var(--coral)}
.btn.ghost{background:transparent;color:var(--mist);border:2px solid var(--line2)}
.btn.sm{height:44px;font-size:14px;padding:0 18px}
.btn.full{width:100%}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--line2);background:transparent;color:var(--mist);font:500 14px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.chip.on{background:var(--lime);border-color:var(--lime);color:var(--ink);font-weight:700}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--line2);flex:none;cursor:pointer;padding:0}
.card{background:var(--surf);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
.fld input,.fld select,.fld textarea,.inp{height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--ink);color:var(--mist);padding:0 14px;font:400 16px 'DM Sans',sans-serif;outline:none;width:100%;min-width:0}
.fld textarea{height:auto;padding:12px 14px;border-radius:18px;resize:none}
.fld input[type=range]{padding:0;accent-color:var(--lime);border:0;background:transparent}
.fld input[type=color],.cin{width:44px;height:44px;padding:0;border:3px solid var(--line2);border-radius:50%;background:none;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rowf{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{height:118px;padding:14px;border-radius:24px;background:var(--surf);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:var(--mist);cursor:pointer}
.tile b{font-size:15px}
.tile small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.tic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.hero{border-radius:28px;background:var(--lime);color:var(--ink);padding:18px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.hero h3{margin:0;font-size:24px;line-height:1.15;font-weight:800}
.hero .btn{background:var(--ink);color:var(--lime);height:40px;font-size:14px;padding:0 18px}
.search{height:48px;border-radius:24px;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--mute)}
.search input{flex:1;min-width:0;height:44px;border:0;outline:0;background:transparent;color:var(--mist);font-size:16px}
.nav{height:calc(84px + env(safe-area-inset-bottom));padding:0 12px env(safe-area-inset-bottom);background:var(--surf);border-top:1px solid var(--line);border-radius:28px 28px 0 0;display:flex;align-items:center;justify-content:space-around;flex:none}
.nav button{width:64px;height:56px;border:0;background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 11px 'DM Sans',sans-serif;cursor:pointer}
.nav button.on{color:var(--lime)}
.nav .fab{width:60px;height:60px;margin-top:-26px;border:4px solid var(--ink);border-radius:50%;background:var(--lime);color:var(--ink)}
.paper{background:#fff;color:#0E0D1A;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.paper .ph{display:flex;justify-content:space-between;align-items:center}
.paper .big{font-size:24px;font-weight:800}
.paper .rule{height:2px;background:#0E0D1A}
.paper .lbl{font-size:12px;font-weight:700;color:#5A5775}
.paper .li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.paper .tot{font-size:26px;font-weight:800;color:#5B3FE0}
.cvwrap{display:grid;place-items:center;background:var(--surf);border-radius:20px;padding:10px}
#cv{max-width:100%;max-height:42dvh;width:auto;height:auto;border-radius:10px;touch-action:none;display:block}
.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tray button{height:64px;border:0;border-radius:18px;background:var(--surf);color:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 11px 'DM Sans',sans-serif;cursor:pointer}
.tray button.hot{background:var(--lime);color:var(--ink);font-weight:700}
.plan{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;background:var(--surf);border:1px solid var(--line)}
.tag{height:26px;padding:0 12px;border-radius:13px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;border:0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{height:68px;border:0;border-radius:18px;background:var(--surf);color:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.day span{font-size:12px;color:var(--mute)}
.day b{font:700 17px 'Sora',sans-serif}
.day.on{background:var(--lime);color:var(--ink)}
.day.on span{color:var(--ink);font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;background:var(--coral)}
.dot.off{background:transparent}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.thumb{position:relative;border-radius:16px;overflow:hidden;background:var(--surf)}
.thumb img{width:100%;display:block}
.thumb button.x{position:absolute;right:6px;top:6px}
.row-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--line)}
.row-item .grow{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--mist);cursor:pointer;padding:0}
.hook{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:20px;background:var(--surf);border:1px solid var(--line);font-size:15px;line-height:1.4}
.hook p{margin:0;flex:1}
.ov{position:fixed;inset:0;background:rgba(14,13,26,.7);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sh{width:100%;max-width:480px;background:var(--surf);border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--mist);color:var(--ink);padding:12px 18px;border-radius:22px;font-weight:700;font-size:14px;z-index:60;max-width:90%}
.empty{padding:18px;border-radius:20px;border:2px dashed var(--line2);color:var(--mute);font-size:14px;text-align:center}
.logoimg{width:72px;height:72px;border-radius:18px;object-fit:cover;background:var(--surf2)}
iframe.prev{width:100%;height:420px;border:0;border-radius:20px;background:#fff}
@media print{body *{visibility:hidden}#paper,#paper *{visibility:visible}#paper{position:absolute;left:0;top:0;width:100%;border-radius:0}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="photoFile" accept="image/*" hidden>
<input type="file" id="logoFile" accept="image/*" hidden>
<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>new Date(s+'T00:00:00');
const inr=n=>'\u20B9 '+Number(n||0).toLocaleString('en-IN');
const ic=(p,s=22,sw=2.2)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const I={
back:'<path d="M15 5l-7 7 7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',
img:'<rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/>',
doc:'<path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M9 11h6M9 15h6"/>',
cal:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
bolt:'<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>',
drop:'<path d="M12 3.5c4.5 4 6.5 7 6.5 10a6.5 6.5 0 0 1-13 0c0-3 2-6 6.5-10z"/>',
link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
home:'<path d="M4 11l8-7 8 7v9H4z"/>',bookmark:'<path d="M6 4h12v16l-6-4-6 4z"/>',
trash:'<path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/>',copy:'<rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',text:'<path d="M5 6V4.5h14V6M12 4.5V20M9 20h6"/>',
box:'<rect x="4" y="6" width="16" height="12" rx="3"/>',circ:'<circle cx="12" cy="12" r="7.5"/>',
chev:'<path d="M9 5l7 7-7 7"/>',left:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',front:'<path d="M12 4l9 5-9 5-9-5zM3 14l9 5 9-5"/>'
};
const logo=(s,bg,fg)=>'<span style="width:'+s+'px;height:'+s+'px;border-radius:'+Math.round(s*.28)+'px;background:'+bg+';display:grid;place-items:center"><svg width="'+Math.round(s*.6)+'" height="'+Math.round(s*.6)+'" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M10 8V28" stroke="'+fg+'" stroke-width="4.5" stroke-linecap="round"/><path d="M26 9L13.5 18L26 28" stroke="'+fg+'" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29" cy="8" r="3" fill="#FF6A4D"/></svg></span>';

/* ---------- storage ---------- */
const KEY='kitfy:v1';
const defaults=()=>({brand:{name:'',colors:['#C8F135','#FF6A4D','#7B5CFF','#F4F3FF','#0E0D1A'],font:'Sora',logo:''},invoices:[],plans:[],bio:{name:'',tag:'',links:[{l:'',u:''}],accent:'#C8F135'},designs:[],invN:0});
let db=(function(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return defaults()}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Phone me jagah kam hai. Kuch purana hata do.');return false}}
let tt;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>{t.style.display='none'},2200)}
function copyText(x){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(x).then(()=>toast('Copy ho gaya'),fb)}else fb();function fb(){const a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copy ho gaya')}catch(e){toast('Copy nahi hua')}a.remove()}}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function resizeImage(file,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',0.88),c.width,c.height)};im.src=r.result};r.readAsDataURL(file)}


function blobToB64(b){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(b)})}
const isNative=()=>{const C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share)};
async function saveFile(blob,name){
if(isNative()){try{const C=window.Capacitor.Plugins;const r=await C.Filesystem.writeFile({path:name,data:await blobToB64(blob),directory:'CACHE'});await C.Share.share({title:name,files:[r.uri],dialogTitle:'Save ya share karo'})}catch(e){const m=String((e&&e.message)||e);if(!/cancel/i.test(m))toast('Save nahi hua: '+m)}return}
download(blob,name)}
async function shareText(t){
if(isNative()){try{await window.Capacitor.Plugins.Share.share({text:t,dialogTitle:'Bhejo'})}catch(e){}return}
if(navigator.share){try{await navigator.share({text:t})}catch(e){}return}
window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
function makePdf(jpg,w,h){const enc=new TextEncoder(),parts=[],offs=[];let len=0;
const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
const obj=(n,body)=>{offs[n]=len;push(n+' 0 obj\n'+body+'\nendobj\n')};
const pw=595,ph=Math.round(595*h/w);
push('%PDF-1.4\n');
obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
offs[4]=len;push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');push(jpg);push('\nendstream\nendobj\n');
const cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';obj(5,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
const xr=len;let x='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
push(x+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}
async function invCanvas(){const v=INV,W=1080,rows=v.items.filter(x=>x.d||x.a);
try{await Promise.all([document.fonts.load("800 40px Sora"),document.fonts.load("700 40px 'DM Sans'")])}catch(e){}
const H=640+rows.length*76+(v.upi?70:0)+(v.note?110:0);const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
g.fillStyle='#fff';g.fillRect(0,0,W,H);g.textBaseline='top';
const T=(t,x,y,f,col,al,mw)=>{g.font=f;g.fillStyle=col;g.textAlign=al||'left';mw?g.fillText(t,x,y,mw):g.fillText(t,x,y)};
const SF="'Sora',system-ui,sans-serif",DF2="'DM Sans',system-ui,sans-serif";
T('INVOICE',70,70,'800 64px '+SF,'#0E0D1A');T(v.no||'',W-70,90,'700 40px '+DF2,'#5B3FE0','right');
g.fillStyle='#0E0D1A';g.fillRect(70,170,W-140,4);
let y=210;T('FROM',70,y,'700 26px '+DF2,'#5A5775');y+=36;T(v.from||'-',70,y,'700 42px '+SF,'#0E0D1A','left',W-140);y+=84;
T('BILL TO',70,y,'700 26px '+DF2,'#5A5775');y+=36;T(v.client||'-',70,y,'700 42px '+SF,'#0E0D1A','left',W-140);y+=84;
T('Date: '+v.date,70,y,'500 30px '+DF2,'#5A5775');y+=70;
rows.forEach(x=>{T(x.d||'Kaam',70,y,'500 36px '+DF2,'#0E0D1A','left',640);T(inr(x.a),W-70,y,'700 36px '+DF2,'#0E0D1A','right');y+=76});
g.fillStyle='#0E0D1A';g.fillRect(70,y,W-140,4);y+=30;
T('Total',70,y+10,'700 40px '+DF2,'#0E0D1A');T(inr(invTotal(v)),W-70,y,'800 58px '+SF,'#5B3FE0','right');y+=100;
if(v.upi){T('UPI: '+v.upi,70,y,'700 34px '+DF2,'#0E0D1A','left',W-140);y+=70}
if(v.note)T(v.note,70,y,'400 32px '+DF2,'#0E0D1A','left',W-140);
return c}

/* ---------- state + router ---------- */
const S={q:'',route:'home',pdate:iso(new Date()),padd:false,pplat:'YouTube',niche:'Fitness',topic:'',hooks:[],caps:[],tags:''};
const TOOLS=[
{id:'designer',name:'Thumbnail',sub:'Poster aur cover',bg:'var(--violet)',fg:'#fff',ic:'img'},
{id:'invoice',name:'Invoice',sub:'UPI link ke saath',bg:'var(--coral)',fg:'var(--ink)',ic:'doc'},
{id:'planner',name:'Planner',sub:'Ideas aur dates',bg:'var(--lime)',fg:'var(--ink)',ic:'cal'},
{id:'hooks',name:'Hook Writer',sub:'Hooks aur captions',bg:'var(--coral)',fg:'var(--ink)',ic:'bolt'},
{id:'brand',name:'Brand Kit',sub:'Colors, fonts, logo',bg:'var(--lime)',fg:'var(--ink)',ic:'drop'},
{id:'bio',name:'Link in Bio',sub:'Portfolio page',bg:'var(--violet)',fg:'#fff',ic:'link'}
];
function go(r,push=true){S.route=r;if(push)history.pushState({r:r},'');render()}
history.replaceState({r:'home'},'');
window.addEventListener('popstate',e=>{S.route=(e.state&&e.state.r)||'home';render()});

const topbar=(t,right)=>'<div class="top"><button class="icon-btn" data-a="back" aria-label="Wapas">'+ic(I.back)+'</button><h2>'+t+'</h2>'+(right||'')+'</div>';
const nav=a=>'<nav class="nav"><button data-a="go" data-r="home" class="'+(a==='home'?'on':'')+'">'+ic(I.home,24)+'Home</button><button class="fab" data-a="sheet" aria-label="Naya banao">'+ic(I.plus,26,3)+'</button><button data-a="go" data-r="saved" class="'+(a==='saved'?'on':'')+'">'+ic(I.bookmark,24)+'Saved</button></nav>';
const fld=(label,key,val,type,ph)=>'<label class="fld"><span>'+label+'</span><input data-i="'+key+'" type="'+(type||'text')+'" value="'+esc(val)+'" placeholder="'+esc(ph||'')+'"></label>';

function render(){
const R=S.route;const S_={home:homeS,saved:savedS,designer:designerS,invoice:invoiceS,planner:plannerS,hooks:hooksS,brand:brandS,bio:bioS};
const withNav=R==='home'||R==='saved';
$('#app').innerHTML='<div class="scroll">'+S_[R]()+'</div>'+(withNav?nav(R):'');
if(R==='designer')initDesigner();
if(R==='bio')bioPreview(true);
}

/* ---------- home ---------- */
const tileH=t=>'<button class="tile" data-a="open" data-t="'+t.id+'"><span class="tic" style="background:'+t.bg+';color:'+t.fg+'">'+ic(I[t.ic])+'</span><span><b class="sora">'+t.name+'</b><small>'+t.sub+'</small></span></button>';
