<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D1A">
<title>Kitfy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E0D1A;--surf:#1A1830;--surf2:#25223F;--line:#2E2B4D;--line2:#39355C;--mist:#F4F3FF;--mute:#A9A6C8;--lime:#C8F135;--coral:#FF6A4D;--violet:#7B5CFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--mist);font-family:'DM Sans',system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font-family:inherit}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto;padding:max(24px,env(safe-area-inset-top)) 20px 28px;display:flex;flex-direction:column;gap:16px}
.sora,h1,h2,h3{font-family:'Sora',system-ui,sans-serif}
h2{margin:0;font-size:20px}
.mute{color:var(--mute);font-size:13px}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.top h2{flex:1}
.icon-btn{width:44px;height:44px;border:0;border-radius:50%;background:var(--surf2);color:var(--mist);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn.sm{width:36px;height:36px}
.btn{height:52px;border:0;border-radius:26px;padding:0 24px;font:700 16px 'Sora',system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn.lime{background:var(--lime)}.btn.coral{background:var(--coral)}
.btn.ghost{background:transparent;color:var(--mist);border:2px solid var(--line2)}
.btn.sm{height:44px;font-size:14px;padding:0 18px}
.btn.full{width:100%}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--line2);background:transparent;color:var(--mist);font:500 14px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.chip.on{background:var(--lime);border-color:var(--lime);color:var(--ink);font-weight:700}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--line2);flex:none;cursor:pointer;padding:0}
.card{background:var(--surf);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
.fld input,.fld select,.fld textarea,.inp{height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--ink);color:var(--mist);padding:0 14px;font:400 16px 'DM Sans',sans-serif;outline:none;width:100%;min-width:0}
.fld textarea{height:auto;padding:12px 14px;border-radius:18px;resize:none}
.fld input[type=range]{padding:0;accent-color:var(--lime);border:0;background:transparent}
.fld input[type=color],.cin{width:44px;height:44px;padding:0;border:3px solid var(--line2);border-radius:50%;background:none;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rowf{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{height:118px;padding:14px;border-radius:24px;background:var(--surf);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:var(--mist);cursor:pointer}
.tile b{font-size:15px}
.tile small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.tic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.hero{border-radius:28px;background:var(--lime);color:var(--ink);padding:18px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.hero h3{margin:0;font-size:24px;line-height:1.15;font-weight:800}
.hero .btn{background:var(--ink);color:var(--lime);height:40px;font-size:14px;padding:0 18px}
.search{height:48px;border-radius:24px;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--mute)}
.search input{flex:1;min-width:0;height:44px;border:0;outline:0;background:transparent;color:var(--mist);font-size:16px}
.nav{height:calc(84px + env(safe-area-inset-bottom));padding:0 12px env(safe-area-inset-bottom);background:var(--surf);border-top:1px solid var(--line);border-radius:28px 28px 0 0;display:flex;align-items:center;justify-content:space-around;flex:none}
.nav button{width:64px;height:56px;border:0;background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 11px 'DM Sans',sans-serif;cursor:pointer}
.nav button.on{color:var(--lime)}
.nav .fab{width:60px;height:60px;margin-top:-26px;border:4px solid var(--ink);border-radius:50%;background:var(--lime);color:var(--ink)}
.paper{background:#fff;color:#0E0D1A;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.paper .ph{display:flex;justify-content:space-between;align-items:center}
.paper .big{font-size:24px;font-weight:800}
.paper .rule{height:2px;background:#0E0D1A}
.paper .lbl{font-size:12px;font-weight:700;color:#5A5775}
.paper .li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.paper .tot{font-size:26px;font-weight:800;color:#5B3FE0}
.cvwrap{display:grid;place-items:center;background:var(--surf);border-radius:20px;padding:10px;position:sticky;top:8px;z-index:6;box-shadow:0 10px 24px rgba(0,0,0,.55)}
#cv{max-width:100%;max-height:32dvh;width:auto;height:auto;border-radius:10px;touch-action:none;display:block}
.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tray button{height:64px;border:0;border-radius:18px;background:var(--surf);color:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 11px 'DM Sans',sans-serif;cursor:pointer}
.tray button.hot{background:var(--lime);color:var(--ink);font-weight:700}
.plan{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;background:var(--surf);border:1px solid var(--line)}
.tag{height:26px;padding:0 12px;border-radius:13px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;border:0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{height:68px;border:0;border-radius:18px;background:var(--surf);color:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.day span{font-size:12px;color:var(--mute)}
.day b{font:700 17px 'Sora',sans-serif}
.day.on{background:var(--lime);color:var(--ink)}
.day.on span{color:var(--ink);font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;background:var(--coral)}
.dot.off{background:transparent}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.thumb{position:relative;border-radius:16px;overflow:hidden;background:var(--surf)}
.thumb img{width:100%;display:block}
.thumb button.x{position:absolute;right:6px;top:6px}
.row-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--line)}
.row-item .grow{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--mist);cursor:pointer;padding:0}
.hook{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:20px;background:var(--surf);border:1px solid var(--line);font-size:15px;line-height:1.4}
.hook p{margin:0;flex:1}
.ov{position:fixed;inset:0;background:rgba(14,13,26,.7);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sh{width:100%;max-width:480px;background:var(--surf);border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--mist);color:var(--ink);padding:12px 18px;border-radius:22px;font-weight:700;font-size:14px;z-index:60;max-width:90%}
.empty{padding:18px;border-radius:20px;border:2px dashed var(--line2);color:var(--mute);font-size:14px;text-align:center}
.logoimg{width:72px;height:72px;border-radius:18px;object-fit:cover;background:var(--surf2)}
iframe.prev{width:100%;height:420px;border:0;border-radius:20px;background:#fff}
.role{height:72px;padding:12px 14px;border-radius:20px;background:var(--surf);border:2px solid var(--line);color:var(--mist);text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px;font:700 15px 'Sora',system-ui,sans-serif}
.role small{font:400 12px 'DM Sans',sans-serif;color:var(--mute)}
.role.on{border-color:var(--lime);background:var(--surf2)}
.av{border-radius:50%;object-fit:cover;background:var(--surf2);display:grid;place-items:center;color:var(--lime);font:800 20px 'Sora',sans-serif;flex:none;overflow:hidden}
.err{color:var(--coral);font-size:14px;line-height:1.4}
.pcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--line);width:100%;text-align:left;color:var(--mist);cursor:pointer}
.pcard .tx{flex:1;min-width:0}
.pcard .bi{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:disabled{opacity:.6;cursor:default}
@media print{body *{visibility:hidden}#paper,#paper *{visibility:visible}#paper{position:absolute;left:0;top:0;width:100%;border-radius:0}}
.pw{position:relative;display:flex}.pw input{padding-right:78px}.pwb{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:32px;padding:0 14px;border:0;border-radius:16px;background:var(--surf2);color:var(--mist);font:700 13px 'DM Sans',sans-serif;cursor:pointer}
.msgs{flex:1;min-height:50dvh;max-height:62dvh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}.msg{max-width:78%;padding:10px 14px;border-radius:18px;background:var(--surf2);align-self:flex-start;word-break:break-word}.msg.me{background:var(--lime);color:var(--ink);align-self:flex-end}.chatbar{position:sticky;bottom:0;background:var(--ink);padding:8px 0}
.msg a{color:inherit;text-decoration:underline;word-break:break-all}.msg .mt{display:block;font-size:11px;opacity:.7;margin-top:4px}.mdel{border:0;background:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0 0 0 6px}#splash{position:fixed;inset:0;z-index:99;background:#0E0D1A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s}#splash b{font:800 34px Sora,system-ui,sans-serif;color:#F4F3FF}
.legal p{margin:8px 0 14px;line-height:1.5}
.mimg{max-width:100%;border-radius:12px;display:block}.msg audio{max-width:100%}
.aiw{display:flex;flex-direction:column;height:100%;min-height:0;position:relative}
.aih{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 14px 8px;flex:none}
.aih .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.aih .tt b{font:800 18px 'Sora',sans-serif}
.aih .tt small{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crd{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:var(--surf);color:var(--lime);font:700 13px 'Sora',sans-serif;cursor:pointer;display:flex;align-items:center;gap:4px;flex:none}
.aim{flex:1;min-height:0;overflow-y:auto;padding:8px 14px 12px;display:flex;flex-direction:column;gap:12px}
.ab{max-width:88%;padding:11px 14px;border-radius:20px;white-space:pre-wrap;word-break:break-word;line-height:1.45;font-size:15px}
.ab.u{align-self:flex-end;background:var(--lime);color:var(--ink);border-bottom-right-radius:6px}
.ab.a{align-self:flex-start;background:var(--surf);border:1px solid var(--line);border-bottom-left-radius:6px}
.ab.a.err{color:var(--coral)}
.ab img{display:block;max-width:100%;max-height:180px;border-radius:12px;margin-bottom:8px}
.ab .fl{display:inline-block;font-size:12px;opacity:.75;margin-bottom:6px}
.ab img.gen,.ab video.gen{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:14px;margin-bottom:8px;background:var(--ink)}.ab a.dl{display:inline-block;margin-bottom:6px;font-size:13px;color:var(--lime);text-decoration:underline}.ab pre.aipre{margin:8px 0;padding:10px;border-radius:12px;background:var(--ink);overflow-x:auto;white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;color:var(--mist)}
.ab code{background:var(--ink);padding:1px 6px;border-radius:6px;font-size:13px;color:var(--mist)}
.aiact{align-self:flex-start;display:flex;gap:6px;align-items:center;margin-top:-6px}
.aiact small{font-size:11px}
.dots{display:inline-flex;gap:5px;padding:4px 0}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:aidot 1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes aidot{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.aicur{display:inline-block;width:8px;height:16px;margin-left:2px;background:var(--lime);vertical-align:-3px;animation:aibl 1s steps(2) infinite}
@keyframes aibl{50%{opacity:0}}
.aic{align-self:stretch;background:var(--surf);border:1px solid var(--lime);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.aic b.sora{font-size:16px}
.aiwel{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 6px}
.aiwel h3{margin:0;font-size:22px}
.aiwel p{margin:0;max-width:300px}
.aigl{width:64px;height:64px;border-radius:22px;background:var(--lime);color:var(--ink);display:grid;place-items:center}
.aisug{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:6px}
.aisug .chip{height:auto;min-height:44px;padding:10px 16px;white-space:normal;text-align:left;border-radius:18px}
.aio{flex:none;padding:6px 14px 0;display:flex;flex-direction:column;gap:8px}
.aio .chip{height:36px;font-size:13px;padding:0 13px}
.aiatt{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line2);border-radius:16px;padding:6px 6px 6px 10px;font-size:13px}
.aiatt img{width:36px;height:36px;object-fit:cover;border-radius:8px}
.aiatt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aib{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 12px max(12px,env(safe-area-inset-bottom))}
.aib textarea{flex:1;min-width:0;max-height:140px;min-height:48px;border-radius:24px;border:1px solid var(--line2);background:var(--surf);color:var(--mist);padding:13px 16px;font:400 16px 'DM Sans',sans-serif;outline:none;resize:none;line-height:1.3}
.aib .icon-btn{width:48px;height:48px}
.aib .icon-btn.on{background:var(--coral);color:var(--ink)}
.aib .icon-btn.send{background:var(--lime);color:var(--ink)}
.aisheet{width:100%;max-width:480px;background:var(--surf);border-radius:28px 28px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.aicr{background:var(--ink);border:1px solid var(--line2);border-radius:18px;padding:12px 14px;font-size:14px}
.aicr b{color:var(--lime);font-size:18px}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="photoFile" accept="image/*" hidden>
<input type="file" id="logoFile" accept="image/*" hidden>
<input type="file" id="avatarFile" accept="image/*" hidden>
<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>new Date(s+'T00:00:00');
const inr=n=>'\u20B9 '+Number(n||0).toLocaleString('en-IN');
const ic=(p,s=22,sw=2.2)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const I={
back:'<path d="M15 5l-7 7 7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',
img:'<rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/>',
doc:'<path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M9 11h6M9 15h6"/>',
cal:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
bolt:'<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>',
drop:'<path d="M12 3.5c4.5 4 6.5 7 6.5 10a6.5 6.5 0 0 1-13 0c0-3 2-6 6.5-10z"/>',
link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
home:'<path d="M4 11l8-7 8 7v9H4z"/>',bookmark:'<path d="M6 4h12v16l-6-4-6 4z"/>',
trash:'<path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/>',copy:'<rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',text:'<path d="M5 6V4.5h14V6M12 4.5V20M9 20h6"/>',
box:'<rect x="4" y="6" width="16" height="12" rx="3"/>',circ:'<circle cx="12" cy="12" r="7.5"/>',
people:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 13.8c2.8 0 4.5 2 4.5 4.7"/>',
user:'<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c0-4 3.3-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/>',
refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
chev:'<path d="M9 5l7 7-7 7"/>',left:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',front:'<path d="M12 4l9 5-9 5-9-5zM3 14l9 5 9-5"/>'
};
const logo=(s,bg,fg)=>'<span style="width:'+s+'px;height:'+s+'px;border-radius:'+Math.round(s*.28)+'px;background:'+bg+';display:grid;place-items:center"><svg width="'+Math.round(s*.6)+'" height="'+Math.round(s*.6)+'" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M10 8V28" stroke="'+fg+'" stroke-width="4.5" stroke-linecap="round"/><path d="M26 9L13.5 18L26 28" stroke="'+fg+'" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29" cy="8" r="3" fill="#FF6A4D"/></svg></span>';

/* ---------- storage ---------- */
let KEY='kitfy:v1:guest';
const defaults=()=>({brand:{name:'',colors:['#C8F135','#FF6A4D','#7B5CFF','#F4F3FF','#0E0D1A'],font:'Sora',logo:''},invoices:[],plans:[],bio:{name:'',tag:'',links:[{l:'',u:''}],accent:'#C8F135'},designs:[],invN:0});
let db=(function(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return defaults()}})();
function switchDb(uid){KEY='kitfy:v1:'+(uid||'guest');try{db=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){db=defaults()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Not enough space on your phone. Delete something old.');return false}}
let tt;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>{t.style.display='none'},2200)}
function copyText(x){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(x).then(()=>toast('Copied'),fb)}else fb();function fb(){const a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Could not copy')}a.remove()}}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function resizeImage(file,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',0.88),c.width,c.height)};im.src=r.result};r.readAsDataURL(file)}

if(AIC.pend){const p=AIC.pend,o=AIC.opt,md=p.um.mode,left=aiLeft();h+=aiBubU(p.um)+'<div class="aic"><b class="sora">Confirm karo</b><div>'+esc(aiModeName(md)+(md==='script'?'':' \u00b7 '+o.ar+' \u00b7 '+o.q+(md==='video'?' \u00b7 '+o.dur+'s':'')+' \u00b7 '+o.style))+'</div><div>Credits lagenge: <b class="sora">'+p.cost+'</b> <span class="mute">(aaj ke '+left+' me se '+Math.max(0,left-p.cost)+' bachenge)</span></div><div class="mute">'+(md==='script'?'Kitfy yahan script banata hai.':md==='image'?'Kitfy asli image banayega (Gemini). Kuch seconds lagte hain.':'Kitfy asli video banayega (Veo). 1-6 minute lag sakte hain, app khula rakho.')+'</div><div class="rowf"><button class="btn ghost sm" style="flex:1" data-a="ai-edit">Edit</button><button class="btn lime sm" style="flex:1" data-a="ai-confirm">Confirm</button></div></div>'}
el.innerHTML=h;el.scrollTop=el.scrollHeight}
function aiLive(am){const b=$('#aiLiveB'),el=$('#aiMsgs');if(!b||!el)return;const near=el.scrollHeight-el.scrollTop-el.clientHeight<160;b.innerHTML=aiMd(am.t)+'<span class="aicur"></span>';if(near)el.scrollTop=el.scrollHeight}
function aiDrawOpts(){const el=$('#aiOpts');if(!el)return;const o=AIC.opt,m=AIC.mode;
const grp=(k,arr,cur)=>arr.map(v=>'<button class="chip '+(String(cur)===String(v)?'on':'')+'" data-a="ai-opt" data-k="'+k+'" data-v="'+v+'">'+(k==='dur'?v+'s':v)+'</button>').join('');
let h='';
if(AIC.att)h+='<div class="aiatt">'+(AIC.att.img?'<img src="'+AIC.att.url+'" alt="">':ic(I.doc,18))+'<span>'+esc(AIC.att.name)+'</span><button class="icon-btn sm" data-a="ai-attx" aria-label="Remove">'+ic(AII.x,16)+'</button></div>';
if(AIC.attm)h+='<div class="chips"><button class="chip" data-a="ai-pick" data-t="img">Photo</button><button class="chip" data-a="ai-pick" data-t="file">File (txt, csv, srt)</button><button class="chip" data-a="ai-pick" data-t="link">Link</button><button class="chip" data-a="ai-pick" data-t="video">Video</button></div>';
if(m==='image'||m==='video'){h+='<div class="chips">'+grp('ar',['9:16','16:9','1:1','4:5'],o.ar)+grp('q',['Standard','HD'],o.q)+'</div><div class="chips">'+(m==='video'?grp('dur',[4,6,8],o.dur):'')+grp('style',['Cinematic','Motion graphics','Realistic','Minimal'],o.style)+'</div>'}
h+='<div class="chips">'+AIM.map(x=>'<button class="chip '+(m===x[0]?'on':'')+'" data-a="ai-mode" data-m="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
el.innerHTML=h}
function aiDrawBtns(){const el=$('#aiBtns');if(!el)return;el.innerHTML='<button class="icon-btn '+(AIC.rec?'on':'')+'" data-a="ai-mic" aria-label="Voice typing">'+ic(AII.mic,22)+'</button>'+(AIC.busy?'<button class="icon-btn send" data-a="ai-stop" aria-label="Stop">'+ic(AII.stop,20,2.6)+'</button>':'<button class="icon-btn send" data-a="ai-send" aria-label="Send">'+ic(AII.send,22,2.6)+'</button>')}
function aiDrawSheet(){const el=$('#aiSheet');if(!el)return;if(!AIC.sheet){el.innerHTML='';return}
const g=(t,k,arr,cur)=>'<div><div class="mute" style="margin-bottom:8px">'+t+'</div><div class="chips" style="flex-wrap:wrap">'+arr.map(a=>'<button class="chip '+(cur===a[0]?'on':'')+'" data-a="ai-set" data-k="'+k+'" data-v="'+a[0]+'">'+a[1]+'</button>').join('')+'</div></div>';
el.innerHTML='<div class="ov" data-a="ai-bg"><div class="aisheet"><div class="rowf" style="justify-content:space-between"><h2>Kitfy AI settings</h2><button class="icon-btn sm" data-a="ai-sheet" aria-label="Close">'+ic(AII.x,18)+'</button></div><div class="aicr"><b class="sora">'+aiLeft()+' / '+AIQ+'</b> free credits bache aaj ke<div class="mute" style="margin-top:4px">Chat 0, Script 0, Image 2, Video 3 (HD +1, 15s +1). Credits sirf successful image/video generation par lagenge. Ye ginti sirf is phone par hai, asli billing nahi.</div></div>'+
g('AI model','model',AIMODEL,AIST.model)+g('Reply language','lang',[['auto','Auto'],['hinglish','Hinglish'],['english','English'],['hindi','Hindi']],AIST.lang)+g('Reply length','len',[['short','Short'],['normal','Normal'],['long','Detailed']],AIST.len)+g('Voice typing language','vlang',[['hi-IN','Hindi'],['en-IN','English (India)']],AIST.vlang)+g('Speak replies aloud','speak',[['on','On'],['off','Off']],AIST.speak?'on':'off')+
'<label class="fld"><span>About me (AI ko yaad rahega)</span><textarea id="aiAbout" rows="3" maxlength="300" placeholder="e.g. Main video editor hoon, Hinglish me reels banata hoon">'+esc(AIST.about)+'</textarea></label><button class="btn ghost sm full" data-a="ai-clear">Chat delete karo</button></div></div>'}
function aiSend(){if(AIC.busy)return;const ta=$('#aiTa'),t=(ta.value||'').trim();
if(!t&&!AIC.att){toast('Kuch likho ya attach karo');return}
if(!AUTH.user){toast('Please log in first');return}
if(!AI_URL){toast('Kitfy AI is not connected yet');return}
const mode=AIC.mode,cost=aiCost();
if(mode==='video'&&AIC.opt.ar!=='16:9'&&AIC.opt.ar!=='9:16'){toast('Video supports only 9:16 and 16:9');return}
if((mode==='image'||mode==='video')&&!AI_MEDIA_URL){toast('Image/video backend is not connected yet (see REPORT.md)');return}
if(aiLeft()<cost){toast('Aaj ke free credits kam hain ('+aiLeft()+'). Kal naye milenge.');return}
const a=AIC.att;const um={r:'u',t:t||'(attachment)',mode:mode,att:a?a.name:'',attObj:a,img:a&&a.img?a:null,txt:a&&a.txt?a.txt:'',cost:cost,opt:Object.assign({},AIC.opt)};
um.s=aiUserText(um.t,mode);ta.value='';AIC.draft='';AIC.att=null;AIC.attm=false;aiGrow();aiDrawOpts();
if(mode==='image'||mode==='video'){AIC.pend={um:um,cost:cost};aiDraw();return}
aiRun(um,cost)}
async function aiRun(um,cost,reuse){
if(!reuse)AIC.msgs.push(um);
const am={r:'a',t:'',live:true};AIC.msgs.push(am);AIC.busy=true;AIC.stopped=false;
aiDraw();aiDrawBtns();aiDrawHead();
if(um.mode==='image'||um.mode==='video')return aiMediaRun(um,am,cost);
const hist=AIC.msgs.filter(m=>m!==am&&!m.err&&m.t).slice(-10);while(hist.length&&hist[0].r!=='u')hist.shift();
const msgs=hist.map(m=>m.r==='u'?{role:'user',text:(m.s||m.t)+(m.txt?'\n\n[File: '+m.att+']\n'+m.txt:''),img:(m===um&&um.img)?{mime:um.img.mime,data:um.img.data}:undefined}:{role:'model',text:m.t});
const last=msgs[msgs.length-1],flat=((last&&last.text)||'').slice(0,1900);
const ac=new AbortController();AIC.ctl=ac;let tmo=false,tm=setTimeout(()=>{tmo=true;ac.abort()},90000);
try{
const res=await fetch(AI_URL,{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,system:aiSystem(um.mode||'chat'),model:AIST.model,maxTokens:({short:400,normal:900,long:2000})[AIST.len]||900,stream:true,prompt:flat})});
clearTimeout(tm);
const ct=res.headers.get('content-type')||'';
if(ct.indexOf('event-stream')>=0&&res.body){
const rd=res.body.getReader(),dec=new TextDecoder();let buf='',er='';
for(;;){tm=setTimeout(()=>{tmo=true;ac.abort()},60000);const x=await rd.read();clearTimeout(tm);if(x.done)break;buf+=dec.decode(x.value,{stream:true});let i;
while((i=buf.indexOf('\n\n'))>=0){const blk=buf.slice(0,i);buf=buf.slice(i+2);blk.split('\n').forEach(l=>{if(l.indexOf('data:')!==0)return;let j;try{j=JSON.parse(l.slice(5))}catch(e){return}if(j.t){am.t+=j.t;aiLive(am)}if(j.err)er=j.err;if(j.m)am.model=j.m})}}
if(!am.t)throw aiErr(er||'No result')
}else{
const tx=await res.text();let j;try{j=JSON.parse(tx)}catch(e){throw aiErr('Kitfy AI sent an unreadable reply. Try again.')}
am.t=String(j.text||'').trim();if(j.m)am.model=j.m;if(!am.t)throw aiErr(j.error||'No result')}
}catch(e){clearTimeout(tm);
if(AIC.stopped){if(!am.t)AIC.msgs.pop()}
else if(!am.t){am.t=e&&e.srv?e.message:(tmo?'Kitfy AI took too long. Try a shorter message or try again later.':'Could not reach Kitfy AI. Check your internet.');am.err=true}}
am.live=false;AIC.busy=false;AIC.ctl=null;aiSaveC();
if(S.route==='ai'){aiDraw();aiDrawBtns();aiDrawHead()}
if(!am.err&&am.t&&AIST.speak)aiSpeak(am.t)}
/* ---------- real image + video generation (via kitfy-media Worker; the API key stays on the server) ---------- */
function aiMediaHtml(md){const u=esc(md.url);return (md.kind==='video'?'<video class="gen" controls playsinline preload="metadata" src="'+u+'"></video>':'<img class="gen" src="'+u+'" alt="Generated image">')+'<a class="dl" href="'+u+'" download="kitfy-'+md.kind+'.'+(md.kind==='video'?'mp4':(md.ext||'png'))+'">Download</a><br>'}
async function aiMediaReq(path,opt,ac){const u=FB&&FB.auth&&FB.auth.currentUser;if(!u)throw aiErr('Please log in first');const tok=await u.getIdToken();
const res=await fetch(AI_MEDIA_URL+path,Object.assign({signal:ac.signal},opt,{headers:Object.assign({Authorization:'Bearer '+tok},(opt&&opt.headers)||{})}));return res}
async function aiMediaJson(path,opt,ac){let res;try{res=await aiMediaReq(path,opt,ac)}catch(e){if(e&&e.name==='AbortError')throw e;if(e&&e.srv)throw e;throw aiErr('Could not reach the Kitfy media server. Check your internet.')}
let j=null;try{j=await res.json()}catch(e){}
if(!res.ok||!j||j.error){const er=(j&&j.error)||{};throw aiErr(er.message||('Media server error ('+res.status+')'))}return j}
const aiWait=(ms,ac)=>new Promise((ok,no)=>{const t=setTimeout(ok,ms);ac.signal.addEventListener('abort',()=>{clearTimeout(t);no(Object.assign(new Error('abort'),{name:'AbortError'}))},{once:true})});
async function aiMediaRun(um,am,cost){
const o=um.opt||AIC.opt,ac=new AbortController();AIC.ctl=ac;let started=false,timedOut=false;
try{
if(um.mode==='image'){
am.t='Creating your image...';aiLive(am);
const j=await aiMediaJson('/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:um.t,aspectRatio:o.ar,quality:o.q,style:o.style})},ac);
if(!j.data)throw aiErr('No image was returned. Try again.');
const mime=String(j.mime||'image/png');if(!/^image\/(png|jpeg|webp)$/.test(mime))throw aiErr('The server sent an unsupported image type.');
am.media={kind:'image',url:'data:'+mime+';base64,'+j.data,ext:mime.split('/')[1].replace('jpeg','jpg')};am.t='Image ready \u00b7 '+o.ar;am.model=j.model||'';
}else{
am.t='Starting video...';aiLive(am);
const s=await aiMediaJson('/video/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:um.t,aspectRatio:o.ar,quality:o.q,style:o.style,durationSeconds:o.dur})},ac);
started=true;const op=encodeURIComponent(s.operation),t0=Date.now(),MAX=8*60*1000;let ready=false,fails=0;
while(Date.now()-t0<MAX){
await aiWait(10000,ac);
try{const st=await aiMediaJson('/video/status?op='+op,{},ac);fails=0;if(st.done&&st.ready){ready=true;break}}
catch(e){if(e&&e.name==='AbortError')throw e;if(e&&e.srv&&!/reach|Media server error \(5/.test(e.message))throw e;if(++fails>=3)throw e}
am.t='Making your video... '+Math.round((Date.now()-t0)/1000)+'s (usually 1-6 min)';aiLive(am)}
if(!ready){timedOut=true;throw aiErr('The video is taking too long. Please try again later.')}
am.t='Downloading video...';aiLive(am);
const fr=await aiMediaReq('/video/file?op='+op,{},ac);
if(!fr.ok){let j=null;try{j=await fr.json()}catch(e){}throw aiErr((j&&j.error&&j.error.message)||'Could not download the video.')}
const blob=await fr.blob();if(!blob||blob.size<1000||!/^video\//.test(blob.type||'video/mp4'))throw aiErr('The downloaded video was empty. Try again.');
am.media={kind:'video',url:URL.createObjectURL(blob)};am.t='Video ready \u00b7 '+o.ar+' \u00b7 '+(s.durationSeconds||o.dur)+'s';am.model=s.model||'';
}
}catch(e){
if(AIC.stopped){am.t='';am.media=null;AIC.msgs.splice(AIC.msgs.indexOf(am),1)}
else{am.media=null;am.err=true;am.t=e&&e.srv?e.message:'Could not reach the Kitfy media server. Check your internet.'}}
if(!am.err&&am.media)aiCrUse(cost);
am.live=false;AIC.busy=false;AIC.ctl=null;aiSaveC();
if(S.route==='ai'){aiDraw();aiDrawBtns();aiDrawHead()}}
function aiRegen(){if(AIC.busy)return;const i=AIC.msgs.length-1;if(i<1||AIC.msgs[i].r!=='a')return;const um=AIC.msgs[i-1];if(um.r!=='u')return;const cost=um.cost||1;if(aiLeft()<cost){toast('Credits kam hain');return}AIC.msgs.pop();aiRun(um,cost,true)}
function aiMic(){const ta=$('#aiTa');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(AIC.rec){try{AIC.rec.stop()}catch(e){}return}
if(!SR){toast('Is phone me voice typing nahi chali. Keyboard ke mic se bolo.');if(ta)ta.focus();return}
const r=new SR();AIC.rec=r;r.lang=AIST.vlang;r.interimResults=true;r.continuous=false;const base=ta.value?ta.value.trim()+' ':'';
r.onresult=ev=>{let s='';for(let i=0;i<ev.results.length;i++)s+=ev.results[i][0].transcript;ta.value=base+s;AIC.draft=ta.value;aiGrow()};
r.onerror=ev=>{toast(ev&&(ev.error==='not-allowed'||ev.error==='service-not-allowed')?'Mic allow nahi hai ya is app me support nahi. Keyboard ke mic se bolo.':'Voice typing nahi chali. Dobara try karo.')};
r.onend=()=>{AIC.rec=null;aiDrawBtns()};
try{r.start();aiDrawBtns()}catch(e){AIC.rec=null;aiDrawBtns()}}
function aiSpeak(t){if(!('speechSynthesis' in window)){toast('Is phone me awaz (speak) support nahi');return}const ss=window.speechSynthesis;if(ss.speaking){ss.cancel();return}const u=new SpeechSynthesisUtterance(String(t).replace(/[*#`\u2022]/g,'').slice(0,2500));u.lang=AIST.vlang;ss.speak(u)}
function aiImgPrep(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);const d=c.toDataURL('image/jpeg',.82);ok({name:(f.name||'photo').slice(0,60),img:1,url:d,mime:'image/jpeg',data:d.split(',')[1]})};im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}
Object.assign(A,{
'ai-send'(){aiSend()},
'ai-stop'(){AIC.stopped=true;if(AIC.ctl)AIC.ctl.abort()},
'ai-mode'(el){if(AIC.pend)A['ai-edit']();AIC.mode=el.dataset.m;aiDrawOpts();aiDrawHead();aiPh()},
'ai-opt'(el){const k=el.dataset.k,v=el.dataset.v;AIC.opt[k]=k==='dur'?Number(v):v;aiDrawOpts()},
'ai-attm'(){AIC.attm=!AIC.attm;aiDrawOpts()},
'ai-pick'(el){const t=el.dataset.t;AIC.attm=false;aiDrawOpts();if(t==='img')$('#aiImg').click();else if(t==='file')$('#aiFile').click();else if(t==='link'){const u=prompt('Link paste karo');if(u){const ta=$('#aiTa');ta.value=((ta.value?ta.value+' ':'')+u.trim()).slice(0,2000);AIC.draft=ta.value;aiGrow()}}else toast('Video upload abhi nahi. Video ka link paste karo ya describe karo.')},
'ai-attx'(){AIC.att=null;aiDrawOpts()},
'ai-mic'(){aiMic()},
'ai-sheet'(){AIC.sheet=!AIC.sheet;aiDrawSheet();aiDrawHead()},
'ai-bg'(el,e){if(e.target===el){AIC.sheet=false;aiDrawSheet()}},
'ai-set'(el){const k=el.dataset.k,v=el.dataset.v;if(k==='speak'){AIST.speak=v==='on';if(!AIST.speak&&window.speechSynthesis)window.speechSynthesis.cancel()}else AIST[k]=v;aiSaveS();aiDrawSheet();aiDrawHead()},
'ai-clear'(){if(!confirm('Poori chat delete karein?'))return;AIC.msgs=[];AIC.pend=null;aiSaveC();aiDraw();AIC.sheet=false;aiDrawSheet()},
'ai-new'(){if(AIC.busy)return;if(AIC.msgs.length&&!confirm('Nayi chat shuru karein? Purani chat delete ho jayegi.'))return;AIC.msgs=[];AIC.pend=null;aiSaveC();aiDraw()},
'ai-sug'(el){const s=AISUG[Number(el.dataset.n)];AIC.mode=s[0];const ta=$('#aiTa');ta.value=s[1];AIC.draft=s[1];aiDrawOpts();aiDrawHead();aiPh();aiGrow();ta.focus()},
'ai-copym'(el){const m=AIC.msgs[Number(el.dataset.n)];if(m&&navigator.clipboard)navigator.clipboard.writeText(m.t).then(()=>toast('Copied')).catch(()=>toast('Could not copy'))},
'ai-speak'(el){const m=AIC.msgs[Number(el.dataset.n)];if(m)aiSpeak(m.t)},
'ai-regen'(){aiRegen()},
'ai-confirm'(){const p=AIC.pend;if(!p)return;AIC.pend=null;aiRun(p.um,p.cost)},
'ai-edit'(){const p=AIC.pend;if(!p)return;AIC.pend=null;const ta=$('#aiTa');ta.value=p.um.t==='(attachment)'?'':p.um.t;AIC.draft=ta.value;if(p.um.attObj)AIC.att=p.um.attObj;aiGrow();aiDraw();aiDrawOpts()}
});
document.addEventListener('change',e=>{const el=e.target,f=el.files&&el.files[0];if(!f)return;
if(el.id==='aiImg'){aiImgPrep(f).then(a=>{AIC.att=a;aiDrawOpts()}).catch(()=>toast('Photo khul nahi payi'));el.value=''}
if(el.id==='aiFile'){if(f.size>600000){toast('File bahut badi hai (max 600 KB)');el.value='';return}f.text().then(t=>{AIC.att={name:f.name.slice(0,60),txt:t.slice(0,12000)};aiDrawOpts()}).catch(()=>toast('File padh nahi payi'));el.value=''}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='aiTa'){AIC.draft=el.value;aiGrow()}if(el.id==='aiAbout'){AIST.about=el.value.slice(0,300);aiSaveS()}});

render();
fbInit();

(function(){const s=document.createElement('div');s.id='splash';s.innerHTML=logo(96,'#C8F135','#0E0D1A')+'<b>Kitfy</b>';document.body.appendChild(s);setTimeout(()=>{s.style.opacity=0;setTimeout(()=>s.remove(),450)},1100)})();
